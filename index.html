<style>
:root{
  --bg:#dfe9ff; --bg2:#c9d8fb; --board:#2b3a7a; --cell:#34468f; --ink:#1c2556; --soft:#51609b;
  --tray:#eef3ff; --btn:#ffb627; --btnInk:#3a2600;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1638; --bg2:#231d4a; --board:#0f0c26; --cell:#221c47; --ink:#eeeaff; --soft:#a79fd6;
    --tray:#241f4d; --btn:#ffb627; --btnInk:#3a2600;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1638; --bg2:#231d4a; --board:#0f0c26; --cell:#221c47; --ink:#eeeaff; --soft:#a79fd6;
  --tray:#241f4d; --btn:#ffb627; --btnInk:#3a2600;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg));
  background-color:var(--bg);
  color:var(--ink);
  font-family:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:10px 14px;gap:12px}
header{width:100%;display:flex;align-items:center;justify-content:space-between}
.best{font-size:1rem;color:var(--soft);font-weight:600;min-width:80px}
.score{font-size:2.6rem;font-weight:700;line-height:1;text-align:center;transition:transform .15s}
.score.bump{transform:scale(1.18)}
.restart{min-width:80px;display:flex;justify-content:flex-end}
.restart button{border:0;background:var(--tray);color:var(--ink);font:inherit;font-size:1.3rem;width:42px;height:42px;border-radius:12px;cursor:pointer}
.restart button:focus-visible,.overlay button:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0}
.board{
  position:relative;
  width:min(92vw, 420px, 56vh);aspect-ratio:1;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;padding:6px;
  background:var(--board);border-radius:16px;
  box-shadow:0 10px 30px rgba(20,20,70,.25);
}
.cell{background:var(--cell);border-radius:6px}
.cell.filled,.b{
  background:var(--c);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.4);
}
.cell.preview{background:var(--c);opacity:.5}
.cell.hint{filter:brightness(1.35) saturate(1.2)}
.cell.burst{animation:burst .42s ease-out forwards}
@keyframes burst{
  0%{background:var(--c);transform:scale(1);filter:brightness(1.6)}
  45%{background:var(--c);transform:scale(1.18);filter:brightness(1.9)}
  100%{background:var(--cell);transform:scale(1);filter:none}
}
.float{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:2rem;font-weight:700;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;animation:rise .9s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;transform:translate(-50%,-30%) scale(.9)}to{opacity:0;transform:translate(-50%,-140%) scale(1.15)}}
.tray{
  width:min(92vw, 420px);height:min(30vw,130px);
  display:flex;align-items:center;justify-content:space-around;
  background:var(--tray);border-radius:18px;padding:8px;
}
.slot{flex:1;height:100%;display:flex;align-items:center;justify-content:center;cursor:grab}
.slot.picked .piece{opacity:.15}
.slot.nofit .piece{opacity:.3;filter:grayscale(.7)}
.piece{display:grid;gap:2px}
.piece .b,.ghost .b{border-radius:4px}
.piece .e,.ghost .e{visibility:hidden}
.ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;display:grid;gap:3px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.ghost .b{border-radius:6px}
.help{font-size:.9rem;color:var(--soft);text-align:center;margin:0}
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(10,8,30,.6);padding:20px}
.overlay.show{display:flex}
.card{background:var(--tray);color:var(--ink);border-radius:22px;padding:26px 30px;text-align:center;max-width:320px;width:100%}
.card h2{margin:0 0 6px;font-size:1.9rem}
.card p{margin:4px 0;font-size:1.1rem;color:var(--soft)}
.card .big{font-size:3rem;font-weight:700;color:var(--ink);margin:6px 0}
.overlay button{margin-top:16px;border:0;background:var(--btn);color:var(--btnInk);font:inherit;font-weight:700;font-size:1.2rem;padding:12px 28px;border-radius:14px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){.cell.burst,.float{animation-duration:.01s}}
</style>

const overlay = document.getElementById('overlay');
let board, tray, score, best = 0, combo, drag = null, cells = [];

try { best = parseInt(localStorage.getItem('blokPatlatBest') || '0', 10) || 0; } catch(e) {}

for (let i = 0; i < N * N; i++) { const d = document.createElement('div'); d.className = 'cell'; boardEl.appendChild(d); cells.push(d); }
const cellAt = (r, c) => cells[r * N + c];

function dims(shape){ let r = 0, c = 0; shape.forEach(([a,b]) => { r = Math.max(r, a + 1); c = Math.max(c, b + 1); }); return { rows: r, cols: c }; }
function fits(shape, r, c){
  return shape.every(([a,b]) => { const rr = r + a, cc = c + b; return rr >= 0 && cc >= 0 && rr < N && cc < N && !board[rr][cc]; });
}
function fitsAnywhere(shape){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (fits(shape, r, c)) return true;
  return false;
}
function randPiece(){ return { shape: SHAPES[Math.floor(Math.random() * SHAPES.length)], color: COLORS[Math.floor(Math.random() * COLORS.length)] }; }
function newTray(){
  let set;
  for (let t = 0; t < 30; t++) { set = [randPiece(), randPiece(), randPiece()]; if (set.some(p => fitsAnywhere(p.shape))) break; }
  tray = set;
}

function buildPiece(p, size, gap){
  const { rows, cols } = dims(p.shape);
  const el = document.createElement('div');
  el.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
  el.style.gridTemplateRows = `repeat(${rows}, ${size}px)`;
  el.style.gap = gap + 'px';
  const set = new Set(p.shape.map(([a,b]) => a + ',' + b));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const b = document.createElement('div');
    if (set.has(r + ',' + c)) { b.className = 'b'; b.style.setProperty('--c', p.color); } else b.className = 'e';
    el.appendChild(b);
  }
  return el;
}

function renderBoard(){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const el = cellAt(r, c), v = board[r][c];
    el.className = 'cell' + (v ? ' filled' : '');
    if (v) el.style.setProperty('--c', v);
  }
}
function renderTray(){
  const slotW = slots[0].clientWidth, slotH = slots[0].clientHeight;
  slots.forEach((s, i) => {
    s.innerHTML = ''; s.classList.remove('picked', 'nofit');
    const p = tray[i]; if (!p) return;
    const { rows, cols } = dims(p.shape);
    const size = Math.max(8, Math.min(22, Math.floor(Math.min((slotW - 8) / cols, (slotH - 8) / rows)) - 2));
    const el = buildPiece(p, size, 2); el.className = 'piece';
    s.appendChild(el);
    if (!fitsAnywhere(p.shape)) s.classList.add('nofit');
  });
}
function setScore(v, bump){
  score = v; scoreEl.textContent = score;
  if (bump) { scoreEl.classList.add('bump'); setTimeout(() => scoreEl.classList.remove('bump'), 150); }
  if (score > best) { best = score; try { localStorage.setItem('blokPatlatBest', String(best)); } catch(e) {} }
  bestEl.textContent = best;
}

function clearPreview(){ cells.forEach(el => el.classList.remove('preview', 'hint')); }
function linesIf(shape, r, c){
  const temp = board.map(row => row.slice());
  shape.forEach(([a,b]) => temp[r + a][c + b] = 'x');
  const rows = [], cols = [];
  for (let i = 0; i < N; i++) {
    if (temp[i].every(v => v)) rows.push(i);
    if (temp.every(row => row[i])) cols.push(i);
  }
  return { rows, cols };
}
function showPreview(){
  clearPreview();
  if (!drag || drag.r === null) return;
  const { shape, color } = drag.p;
  shape.forEach(([a,b]) => { const el = cellAt(drag.r + a, drag.c + b); el.classList.add('preview'); el.style.setProperty('--c', color); });
  const { rows, cols } = linesIf(shape, drag.r, drag.c);
  rows.forEach(r => { for (let c = 0; c < N; c++) cellAt(r, c).classList.add('hint'); });
  cols.forEach(c => { for (let r = 0; r < N; r++) cellAt(r, c).classList.add('hint'); });
}

function cellMetrics(){
  const first = cells[0].getBoundingClientRect();
  return { size: first.width, left: first.left, top: first.top, step: first.width + GAP };
}

slots.forEach(s => s.addEventListener('pointerdown', e => {
  const i = +s.dataset.i; if (!tray[i] || drag) return;
  e.preventDefault();
  const m = cellMetrics();
  const ghost = buildPiece(tray[i], m.size, GAP); ghost.className = 'ghost';
  document.body.appendChild(ghost);
  drag = { i, p: tray[i], ghost, touch: e.pointerType !== 'mouse', r: null, c: null };
  s.classList.add('picked');
  moveDrag(e);
}));

function moveDrag(e){
  if (!drag) return;
  const m = cellMetrics();
  const { rows, cols } = dims(drag.p.shape);
  const w = cols * m.step - GAP, h = rows * m.step - GAP;
  const lift = drag.touch ? m.size * 1.6 + h / 2 : 0;
  const left = e.clientX - w / 2, top = e.clientY - h / 2 - lift;
  drag.ghost.style.transform = `translate(${left}px, ${top}px)`;
  const c = Math.round((left - m.left) / m.step), r = Math.round((top - m.top) / m.step);
  if (fits(drag.p.shape, r, c)) { drag.r = r; drag.c = c; } else { drag.r = null; drag.c = null; }
  showPreview();
}
window.addEventListener('pointermove', moveDrag);
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', () => { if (drag) { drag.r = null; endDrag(); } });

function endDrag(){
  if (!drag) return;
  const d = drag; drag = null;
  d.ghost.remove(); clearPreview();
  if (d.r !== null) place(d.i, d.p, d.r, d.c);
  else slots[d.i].classList.remove('picked');
}

function floatText(txt){
  const f = document.createElement('div'); f.className = 'float'; f.textContent = txt;
  boardEl.appendChild(f); setTimeout(() => f.remove(), 900);
}

function place(i, p, r, c){
  p.shape.forEach(([a,b]) => board[r + a][c + b] = p.color);
  let gained = p.shape.length;
  const { rows, cols } = linesIf([], 0, 0);
  const cleared = [];
  rows.forEach(rr => { for (let cc = 0; cc < N; cc++) cleared.push([rr, cc]); });
  cols.forEach(cc => { for (let rr = 0; rr < N; rr++) cleared.push([rr, cc]); });
  const colorsBefore = cleared.map(([a,b]) => board[a][b]);
  const lines = rows.length + cols.length;
  if (lines > 0) {
    combo++;
    gained += lines * lines * 10 + (combo > 1 ? (combo - 1) * 10 : 0);
    cleared.forEach(([a,b]) => board[a][b] = null);
  } else combo = 0;

  tray[i] = null;
  if (tray.every(x => !x)) newTray();
  renderBoard();
  cleared.forEach(([a,b], k) => {
    const el = cellAt(a, b); el.style.setProperty('--c', colorsBefore[k]); el.classList.add('burst');
    setTimeout(() => el.classList.remove('burst'), 430);
  });
  if (lines > 0) floatText('+' + gained + (combo > 1 ? '  Kombo x' + combo : ''));
  setScore(score + gained, lines > 0);
  renderTray();
  if (!tray.some(x => x && fitsAnywhere(x.shape))) setTimeout(gameOver, 600);
}

function gameOver(){
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = 'En iyi skor: ' + best;
  overlay.classList.add('show');
  document.getElementById('againBtn').focus();
  const rw=document.getElementById('rwBtn'); rw.hidden=true;
  if(!devamKullanildi){Reklam.odul('blok_devam',function(goster){rw.hidden=false;rw.onclick=function(){rw.hidden=true;goster();};},devamEt);}
}
let devamKullanildi=false;
function devamEt(){
  devamKullanildi=true;
  // ortadaki 2 satır ve 2 sütunu temizle, yeni parçalar ver
  for(let i=0;i<N;i++){ board[3][i]=null; board[4][i]=null; board[i][3]=null; board[i][4]=null; }
  newTray(); overlay.classList.remove('show'); renderBoard(); renderTray();
}

function start(){
  board = Array.from({ length: N }, () => Array(N).fill(null));
  combo = 0; devamKullanildi = false; document.getElementById('rwBtn').hidden = true; overlay.classList.remove('show');
  newTray(); renderBoard(); setScore(0, false); renderTray();
}
document.getElementById('againBtn').addEventListener('click', function(){ Reklam.arada('blok_tekrar', start); });
document.getElementById('restartBtn').addEventListener('click', start);
window.addEventListener('resize', () => { if (tray) renderTray(); });
start();
</script>
</body>
</html>
